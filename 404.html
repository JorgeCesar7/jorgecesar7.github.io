<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Alejandro</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0b0f0c">
    <link rel="icon" type="image/png" sizes="48x48" href="/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#0b0f0c;color:#f2f5f3;font-family:'Poppins',system-ui,sans-serif;text-align:center}
        main{max-width:520px}
        .code{font-size:clamp(72px,18vw,128px);font-weight:700;line-height:1;color:#2ecc71;text-shadow:0 0 32px rgba(46,204,113,.35)}
        h1{margin-top:12px;font-size:clamp(22px,5vw,30px);font-weight:600}
        p{margin-top:12px;color:#9fb1a7;font-size:16px;line-height:1.6}
        .actions{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
        a{display:inline-block;padding:12px 22px;border-radius:999px;font-weight:600;text-decoration:none;font-size:15px}
        .primary{background:#2ecc71;color:#0b0f0c}
        .ghost{border:1.5px solid rgba(46,204,113,.5);color:#d7e2db}
        a:focus-visible{outline:2px solid #f2f5f3;outline-offset:3px}
    </style>
</head>
<body>
    <main>
        <div class="code" aria-hidden="true">404</div>
        <h1>Esta página no existe</h1>
        <p>Puede que el enlace esté mal escrito o que la página se haya movido. Desde el inicio encuentras todo.</p>
        <div class="actions">
            <a class="primary" href="/">Ir al inicio</a>
            <a class="ghost" href="https://wa.me/18295517567" target="_blank" rel="noopener">Escríbeme por WhatsApp</a>
        </div>
    </main>
</body>
</html>
